mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - "any:53"

dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
  fallback:
    - https://dns.google/dns-query

proxy-providers:
  krusofiya:
    type: http
    url: "https://example.com/YOUR_TOKEN"
    interval: 3600
    path: ./providers/provider_name.yaml
    header:
      User-Agent: ["ClashMeta/2.11.27"]
      x-hwid: ["YOUR_HARDWARE_ID"]
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

proxy-groups:
  - name: "Proxies"
    type: select
    use:
      - provider_name

rules:
  - MATCH,Proxies
